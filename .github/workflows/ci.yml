name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: Web (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  rules:
    name: Firestore rules (emulator tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/rules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/rules/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test

  android:
    name: Android (build + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Placeholder google-services.json (CI only, not a real project)
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": { "project_number": "000000000000", "project_id": "chaukas-ci-placeholder", "storage_bucket": "chaukas-ci-placeholder.appspot.com" },
            "client": [{
              "client_info": { "mobilesdk_app_id": "1:000000000000:android:0000000000000000", "android_client_info": { "package_name": "app.chaukas" } },
              "api_key": [{ "current_key": "placeholder" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          JSON
      - run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: chaukas-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  ios:
    name: iOS (core checks + simulator build)
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: xcodebuild -version && xcodebuild -showsdks | grep -i ios
      - name: Core logic checks (redaction, signals, parsing)
        run: |
          swiftc -O Chaukas/Analysis.swift Chaukas/Signals.swift Chaukas/Redactor.swift Tests/main.swift -o "$RUNNER_TEMP/chaukas-core-checks"
          "$RUNNER_TEMP/chaukas-core-checks"
      - run: brew install xcodegen
      - name: Placeholder GoogleService-Info.plist (CI only, not a real project)
        run: |
          cat > Chaukas/GoogleService-Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>API_KEY</key><string>placeholder</string>
            <key>GCM_SENDER_ID</key><string>000000000000</string>
            <key>BUNDLE_ID</key><string>app.chaukas</string>
            <key>PROJECT_ID</key><string>chaukas-ci-placeholder</string>
            <key>GOOGLE_APP_ID</key><string>1:000000000000:ios:0000000000000000</string>
          </dict></plist>
          PLIST
      - run: xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project Chaukas.xcodeproj -scheme Chaukas -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO build | tail -200
