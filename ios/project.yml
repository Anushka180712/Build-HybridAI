name: Chaukas
options:
  bundleIdPrefix: app.chaukas
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    # 12.19.x ships Firebase AI Logic's HybridModel (Apple Foundation Models + Gemini).
    exactVersion: "12.19.3"
targets:
  Chaukas:
    type: application
    platform: iOS
    sources:
      - path: Chaukas
    resources:
      - path: Chaukas/GoogleService-Info.plist
        optional: true
    info:
      path: Chaukas/Info.plist
      properties:
        CFBundleDisplayName: Chaukas
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Light
        # chaukas://check?text=… from Shortcuts and the share extension
        CFBundleURLTypes:
          - CFBundleURLName: app.chaukas
            CFBundleURLSchemes: [chaukas]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.chaukas
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: ChaukasShare
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAILogic
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseRemoteConfig

  # "Chaukas" in the share sheet: an instant on-device verdict, then the full check in the app.
  ChaukasShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ChaukasShare
      - path: Chaukas/Signals.swift
      - path: Chaukas/Theme.swift
    info:
      path: ChaukasShare/Info.plist
      properties:
        CFBundleDisplayName: Chaukas
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.chaukas.share
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
